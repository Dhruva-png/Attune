name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What did you do, and what did you expect to happen instead?
      placeholder: |
        1. Run `attune`
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: |
        Set `ATTUNE_LOG_LEVEL=DEBUG` in your `.env` to get more detail. Paste any traceback here —
        it'll be automatically formatted as code, no need for backticks.
      render: shell

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: python --version
    validations:
      required: true

  - type: input
    id: llm-provider
    attributes:
      label: LLM provider (if relevant)
      description: Only needed if the bug involves the AI Coach.
      placeholder: e.g. ollama / openai / gemini / claude / groq
