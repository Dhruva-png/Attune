name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # PySide6 tests never open a real window, but the Qt6 shared libraries
    # still dynamically link against these at import time (not just at
    # render time) — a bare ubuntu-latest runner has none of them installed,
    # so tests/unit/dashboard/* fail to even import without this.
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Qt6 runtime libraries (headless PySide6 support)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check attune tests

      - name: Type check (mypy)
        run: mypy attune

      - name: Enforce architectural layering (import-linter)
        run: lint-imports

      - name: Test
        run: pytest

      - name: Performance & integration tests
        run: pytest -m "performance or integration" --no-cov
