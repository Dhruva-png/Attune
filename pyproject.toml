[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attune"
version = "0.1.0"
description = "Attune — Learn your habits. Improve your focus. A privacy-first, webcam-only AI productivity coach."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Attune" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Capture",
]

dependencies = [
    # Backend
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "websockets>=13.1",
    # Computer vision
    "opencv-python>=4.10",
    "mediapipe>=0.10.18",
    "ultralytics>=8.3",
    "onnxruntime>=1.20",
    "numpy>=1.26,<2.0",
    # Embeddings / local NLP
    "sentence-transformers>=3.2",
    # LLM providers: each vendor's REST API is called directly over httpx
    # (already a dependency below) rather than pulling in five separate SDKs
    # with their own dependency trees — see attune/llm/providers/.
    # Desktop UI
    "PySide6>=6.8",
    "qasync>=0.27",
    "plotly>=5.24",
    # Reporting / export
    "reportlab>=4.2",
    "pandas>=2.2",
    "kaleido>=0.2.1",
    # Utilities
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pre-commit>=4.0",
]
cuda = [
    "onnxruntime-gpu>=1.20",
]

[project.scripts]
attune-api = "attune.api.main:run"
attune = "attune.launcher:run"

[tool.hatch.build.targets.wheel]
packages = ["attune"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["attune", "tests"]
extend-exclude = ["attune/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern requires calling Depends()/Query() etc. in argument
# defaults — B008 exists to catch mutable-default bugs, not this idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# Qt event handlers (paintEvent, resizeEvent, closeEvent, ...) are required
# overrides using Qt's camelCase convention, not renameable to snake_case.
"attune/dashboard/**/*.py" = ["N802"]

[tool.mypy]
python_version = "3.12"
packages = ["attune"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mediapipe.*", "ultralytics.*", "torch.*", "torchvision.*", "qasync.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=attune --cov-report=term-missing -m \"not performance and not integration\""
markers = [
    "performance: marks perf/latency budget tests",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["attune"]
omit = ["attune/dashboard/*", "attune/assets/*"]

# Enforces the layering rules in docs/architecture/03-module-dependencies.md:
# vision/behaviour never import database/api/dashboard/llm; core stays dependency-free.
[tool.importlinter]
root_package = "attune"

[[tool.importlinter.contracts]]
name = "Core has no infrastructure dependencies"
type = "forbidden"
source_modules = ["attune.core"]
forbidden_modules = [
    "attune.vision", "attune.behaviour", "attune.analytics",
    "attune.database", "attune.llm", "attune.reports",
    "attune.api", "attune.dashboard",
]

[[tool.importlinter.contracts]]
name = "Vision pipeline stays isolated from downstream layers"
type = "forbidden"
source_modules = ["attune.vision"]
forbidden_modules = [
    "attune.behaviour", "attune.analytics", "attune.database",
    "attune.llm", "attune.api", "attune.dashboard",
]

[[tool.importlinter.contracts]]
name = "Behaviour engines stay isolated from vision/analytics/presentation"
type = "forbidden"
source_modules = ["attune.behaviour"]
forbidden_modules = ["attune.vision", "attune.analytics", "attune.api", "attune.dashboard"]

[[tool.importlinter.contracts]]
name = "Analytics engine stays isolated from vision/behaviour/presentation"
type = "forbidden"
source_modules = ["attune.analytics"]
forbidden_modules = ["attune.vision", "attune.behaviour", "attune.api", "attune.dashboard"]

[[tool.importlinter.contracts]]
name = "Dashboard never bypasses the API into infrastructure"
type = "forbidden"
source_modules = ["attune.dashboard"]
forbidden_modules = ["attune.vision", "attune.database", "attune.llm"]
